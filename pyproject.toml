[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.15.0",
  "datasets>=5.0.1",
  "huggingface-hub>=1.33.0",
  "matplotlib>=3.11.2",
  "openai>=3.24.0",
  "pandas>=3.0.6",
  "pyarrow>=23.0.1",
  "pypdf>=6.19.0",
  "requests>=2.34.2",
  "scikit-learn>=1.9.1",
  "scipy>=1.18.1",
  "seaborn>=0.13.2",
  "sentence-transformers>=6.1.0",
  "statsmodels>=0.14.5",
  "tenacity>=9.1.4",
  "torch>=2.7.1,<2.8",
  "transformers>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
